apiVersion: apps/v1
kind: Deployment
metadata: { name: kestrel }
spec:
  replicas: 2
  selector: { matchLabels: { app: kestrel } }
  template:
    metadata: { labels: { app: kestrel } }
    spec:
      containers:
        - name: kestrel
          image: megathon-kestrel:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{ secretRef: { name: app-env } }, { configMapRef: { name: app-urls } }]
          env:
            - { name: BETTER_AUTH_URL, value: "http://kestrel.localtest.me:8080" }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 3 }
          resources: { requests: { cpu: 100m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kestrel }
spec:
  selector: { app: kestrel }
  ports: [{ port: 3000 }]
