[project]
name = "mega-common"
version = "0.1.0"
description = "Shared settings, auth and app factory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143", "uvicorn[standard]>=0.38", "pydantic-settings>=2.11", "httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mega_common"

