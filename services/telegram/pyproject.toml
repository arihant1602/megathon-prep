[project]
name = "telegram"
version = "0.1.0"
description = "Telegram front end for Boli (voice notes in, voice replies out)"
requires-python = ">=3.12"
dependencies = ["mega-common"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "telegram_service"

[tool.uv.sources]
mega-common = { workspace = true }
