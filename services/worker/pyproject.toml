[project]
name = "worker"
version = "0.1.0"
description = "Background job worker (Redis queue)"
requires-python = ">=3.12"
dependencies = ["mega-common", "pypdf>=5"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_service"

[tool.uv.sources]
mega-common = { workspace = true }
